name: CI

# Nothing here needs game files. The tests and tool checks run on every push; the toolchain smoke test downloads the
# pinned compiler archives and wibo, compiles tests/toolchain/trivial.c and checks the object. The full rebuild needs
# your own copy of the game and is not run in CI.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MIPS binutils and Ninja for relocation and graph tests
        run: sudo apt-get update && sudo apt-get install -y binutils-mipsel-linux-gnu ninja-build
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Byte-compile the tools and tests
        run: python -m compileall -q configure.py tools tests
      - name: Every tool answers --help
        run: |
          for tool in tools/*.py tools/permuter/*.py tools/build/*.py tools/pipeline/*.py tools/maint/*.py; do
            python "$tool" --help > /dev/null || { echo "FAILED: $tool --help"; exit 1; }
          done
      - name: The tools index is current
        run: python tools/tools_index.py --check
      - name: Configuration files parse
        run: |
          python - <<'PY'
          import json, pathlib, yaml
          for p in pathlib.Path("config").rglob("*.json"):
              json.loads(p.read_text())
          for name in ("tus_overrides.yaml", "SLUS_213.76/splits.yaml"):
              yaml.safe_load(pathlib.Path("config", name).read_text())
          for p in pathlib.Path(".github").rglob("*.yml"):
              yaml.safe_load(p.read_text())
          PY
      - name: The split list is consistent (every function has one owner file, no overlapping ranges)
        run: python tools/build/splits.py check
      - name: configure.py writes a build file
        run: python configure.py --version SLUS_213.76 && test -s build.ninja
      - name: Build, tool and generated-file graph tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s tests/tools

  toolchain-smoke:
    # Downloads the pinned toolchain and compiles one file; informational until it has run on the hosted runners for a while.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache the downloaded toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchain
          key: toolchain-${{ hashFiles('config/toolchain-*.json') }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-mipsel-linux-gnu libc6-i386 xz-utils
      - name: Install the pinned toolchain
        run: python tools/toolchain.py install
      - name: Compile the trivial C and C++ files with SN GCC 2.95.3
        run: |
          mkdir -p build/smoke
          python tools/compile.py ee-gcc2.95.3-136 -O2 -G0 -snas -c tests/toolchain/trivial.c -o build/smoke/trivial_c.o
          python tools/compile.py ee-gcc2.95.3-136 -O2 -G0 -snas -c tests/toolchain/trivial.cpp -o build/smoke/trivial_cpp.o
          mipsel-linux-gnu-readelf -h build/smoke/trivial_c.o | grep -q "MIPS R3000"
          test "$(mipsel-linux-gnu-readelf -S build/smoke/trivial_c.o | grep -c '\.text')" -ge 1
