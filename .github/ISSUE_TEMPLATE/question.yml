name: Question
description: Ask about the method, the tools or the code
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please read README.md, CONTRIBUTING.md and docs/glossary.md first. Do not attach game files or disassembly.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, what you tried, and where you got stuck (a function address or a file is enough context)
    validations:
      required: true
